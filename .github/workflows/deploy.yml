name: Deploy (production)

# Never runs on its own. Start it by hand: Actions → "Deploy (production)" → Run workflow.
# The `production` GitHub Environment should have "Required reviewers" so a second click approves the release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (default: main)'
        default: main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          state=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" --jq '[.check_runs[] | select(.name | test("Lint|Integration|E2E"))] | if length==0 then "missing" elif all(.conclusion=="success") then "ok" else "bad" end')
          [ "$state" = ok ] || { echo "::error::CI is not green for $sha ($state). Fix CI first."; exit 1; }
      - id: meta
        run: |
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push api, worker, web
        run: |
          for target in api worker web; do
            docker buildx build -f infra/docker/Dockerfile --target "$target" \
              --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" \
              --build-arg NEXT_PUBLIC_WEB_URL="${{ vars.NEXT_PUBLIC_WEB_URL }}" \
              --build-arg NEXT_PUBLIC_UPLOAD_ORIGIN="${{ vars.NEXT_PUBLIC_UPLOAD_ORIGIN }}" \
              --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ vars.NEXT_PUBLIC_SENTRY_DSN }}" \
              --build-arg NEXT_PUBLIC_POSTHOG_KEY="${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}" \
              --cache-from type=gha,scope=$target --cache-to type=gha,mode=max,scope=$target \
              -t ghcr.io/${{ steps.meta.outputs.owner }}/glasswork-$target:${{ steps.meta.outputs.tag }} --push .
          done
      - name: Copy deploy files to the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -az -e "ssh -i ~/.ssh/id_deploy" --exclude state --exclude .env.production \
            infra/prod/ "deploy@${{ secrets.DEPLOY_HOST }}:/opt/glasswork/infra/prod/"
      - name: Deploy (blue/green, automatic rollback on failed health check)
        run: |
          ssh -i ~/.ssh/id_deploy "deploy@${{ secrets.DEPLOY_HOST }}" \
            "echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && cd /opt/glasswork/infra/prod && chmod +x scripts/*.sh && ./scripts/deploy.sh ${{ steps.meta.outputs.tag }}"
