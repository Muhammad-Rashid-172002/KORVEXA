name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint · types · unit · build · audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build
      - name: Dependency audit (high+ in production deps)
        run: pnpm audit --prod --audit-level=high

  integration:
    name: Integration (Testcontainers Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@glasswork/api...
      - run: pnpm test:integration

  e2e:
    name: E2E (docker compose + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: cp .env.example .env
      # e2e signs up/in far more than 10×/min from one IP; the limiter itself is covered by an integration test.
      - run: |
          echo 'AUTH_RATE_LIMIT_MAX=500' >> .env
          echo 'RATE_LIMIT_PER_MINUTE=5000' >> .env
      - name: Start the stack
        run: pnpm dev:up
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @glasswork/shared build
      - run: pnpm --filter @glasswork/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml --env-file .env logs --no-color api worker web migrate | tail -300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: artifacts/
          retention-days: 7
