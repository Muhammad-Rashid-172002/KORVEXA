# Always-on services: Caddy (HTTPS + routing), Redis (queues, rate limits, sockets), ClamAV (upload scanning), worker.
# The web + api containers live in docker-compose.app.yml so they can be swapped blue/green without downtime.
# Postgres and file storage are EXTERNAL (managed Postgres, Cloudflare R2): nothing stateful but Redis runs here.
name: glasswork-edge

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '5' }

networks:
  edge:
    name: glasswork_edge

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  clamav_db:

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN (e.g. example.com) in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./state/caddy:/etc/caddy/active:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes: [redis_data:/data]
    networks: [edge]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes: [clamav_db:/var/lib/clamav]
    networks: [edge]
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamdcheck.sh']
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 180s
    logging: *logging

  worker:
    image: ghcr.io/${GHCR_OWNER:?}/glasswork-worker:${IMAGE_TAG:?}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      API_INTERNAL_URL: http://api-${SLOT:-blue}:4000
      CLAMD_HOST: clamav
      SCAN_MODE: clamav
    depends_on:
      redis: { condition: service_healthy }
    networks: [edge]
    logging: *logging
