# Glasswork local stack. One command from the repo root:  pnpm dev:up
# (= pull images with retries, docker compose up --build -d, wait for health, storage smoke test)
#
# Browser-facing URLs:  web http://localhost:3000 · api http://localhost:4000 (docs /v1/docs)
#                       mail http://localhost:8025 · storage console http://localhost:9001
name: glasswork

x-app-build: &app-build
  context: ..
  dockerfile: infra/docker/Dockerfile
  args:
    NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:4000}
    NEXT_PUBLIC_WEB_URL: ${WEB_URL:-http://localhost:3000}
    NEXT_PUBLIC_UPLOAD_ORIGIN: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}

# Environment shared by api + migrate. Hostnames point at compose services; public URLs stay localhost.
x-api-env: &api-env
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_PORT: 4000
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
  WEB_URL: ${WEB_URL:-http://localhost:3000}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  TRUST_PROXY: 'false'
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
  DATABASE_URL: postgres://${POSTGRES_USER:-glasswork}:${POSTGRES_PASSWORD:-glasswork}@postgres:5432/${POSTGRES_DB:-glasswork}
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
  AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  S3_ENDPOINT: http://rustfs:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-glasswork-dev}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-glasswork}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-glasswork-dev-secret}
  S3_FORCE_PATH_STYLE: 'true'
  S3_AUTO_CREATE_BUCKET: 'true'
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
  SCAN_MODE: ${SCAN_MODE:-off}
  AI_PROVIDER: ${AI_PROVIDER:-stub}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
  AI_MODEL_BRIEF_BUILDER: ${AI_MODEL_BRIEF_BUILDER:-}
  AI_MODEL_MATCHING: ${AI_MODEL_MATCHING:-}
  AI_MODEL_PROGRESS_REPORT: ${AI_MODEL_PROGRESS_REPORT:-}
  AI_MODEL_MEETING_NOTES: ${AI_MODEL_MEETING_NOTES:-}
  AI_EFFORT: ${AI_EFFORT:-medium}
  AI_DAILY_USER_CAP_CENTS: ${AI_DAILY_USER_CAP_CENTS:-100}
  AI_DAILY_GLOBAL_CAP_CENTS: ${AI_DAILY_GLOBAL_CAP_CENTS:-2000}
  AI_RATE_LIMIT_PER_HOUR: ${AI_RATE_LIMIT_PER_HOUR:-30}
  VIDEO_PROVIDER: ${VIDEO_PROVIDER:-stub}
  DAILY_API_KEY: ${DAILY_API_KEY:-}
  DAILY_DOMAIN: ${DAILY_DOMAIN:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev-only-github-webhook-secret}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@localhost}
  PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-test}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  PAYMENTS_LIVE_ENABLED: ${PAYMENTS_LIVE_ENABLED:-false}
  TEST_PAYMENTS_WEBHOOK_SECRET: ${TEST_PAYMENTS_WEBHOOK_SECRET:-dev-only-test-payments-secret}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-only-internal-token-change-me-0123456789}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glasswork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glasswork}
      POSTGRES_DB: ${POSTGRES_DB:-glasswork}
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['${REDIS_PORT:-6379}:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Local S3-compatible storage: RustFS (DECISIONS D-046). Path-style URLs; its root keys are the app's
  # S3 keys (local only). Production uses Cloudflare R2.
  rustfs:
    image: ${STORAGE_IMAGE:-rustfs/rustfs:1.0.1}
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-glasswork}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-glasswork-dev-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      # Browser uploads go straight to storage with presigned URLs, so the S3 API must answer CORS for the web app.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${WEB_URL:-http://localhost:3000}
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports: ['${STORAGE_API_PORT:-9000}:9000', '${STORAGE_CONSOLE_PORT:-9001}:9001']
    volumes: [storagedata:/data]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports: ['${MAILPIT_UI_PORT:-8025}:8025', '${MAILPIT_SMTP_PORT:-1025}:1025']
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  # On start the API applies migrations and the idempotent dev seed, then serves (local stack only).
  api:
    build: { <<: *app-build, target: api }
    image: glasswork-api:dev
    environment: *api-env
    command:
      [
        'sh',
        '-c',
        'node node_modules/@glasswork/db/dist/migrate.js && node node_modules/@glasswork/db/dist/seed/index.js && exec node --enable-source-maps dist/main.js',
      ]
    ports: ['${API_PORT:-4000}:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rustfs: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  worker:
    build: { <<: *app-build, target: worker }
    image: glasswork-worker:dev
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_HEALTH_PORT: 4001
      REDIS_URL: redis://redis:6379
      EMAIL_FROM: ${EMAIL_FROM:-Glasswork <no-reply@glasswork.local>}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      API_INTERNAL_URL: http://api:4000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-only-internal-token-change-me-0123456789}
      SCAN_MODE: ${SCAN_MODE:-off}
      CLAMD_HOST: clamav
      CLAMD_PORT: 3310
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-glasswork-dev}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-glasswork}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-glasswork-dev-secret}
      S3_FORCE_PATH_STYLE: 'true'
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    ports: ['${WORKER_HEALTH_PORT:-4001}:4001']
    depends_on:
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      api: { condition: service_healthy }
    restart: unless-stopped

  # Opt-in antivirus (≈1–1.5 GB RAM, large image): `docker compose --profile scan up -d clamav`, then set SCAN_MODE=clamav.
  clamav:
    image: clamav/clamav:1.4
    profiles: ['scan']
    ports: ['3310:3310']
    volumes: [clamdata:/var/lib/clamav]
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  web:
    build: { <<: *app-build, target: web }
    image: glasswork-web:dev
    environment:
      API_INTERNAL_URL: http://api:4000
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Dev only: serves /design. The production compose file must not set this.
      ENABLE_STYLEGUIDE: '1'
    ports: ['3000:3000']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storagedata:
  clamdata:
