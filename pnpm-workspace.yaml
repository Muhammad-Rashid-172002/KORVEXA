packages:
  - apps/*
  - packages/*
  - e2e
minimumReleaseAgeExclude:
  - prettier@3.9.10
  - lucide-react@1.55.0

# pnpm blocks dependency build scripts by default; allow only the ones we need.
allowBuilds:
  esbuild: true
  '@swc/core': true
  msgpackr-extract: true
  protobufjs: true
  # Not needed (telemetry / optional native ssh for testcontainers):
  '@scarf/scarf': false
  cpu-features: false
  ssh2: false
  # Sentry CLI binary is only needed for source-map uploads (not configured yet).
  '@sentry/cli': false
