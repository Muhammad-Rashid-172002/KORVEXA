packages:
  - apps/*
  - packages/*
  - e2e
minimumReleaseAgeExclude:
  - prettier@3.9.10
  - lucide-react@1.55.0
  - nodemailer@10.1.0

# pnpm blocks dependency build scripts by default; allow only the ones we need.
allowBuilds:
  esbuild: true
  '@swc/core': true
  msgpackr-extract: true
  protobufjs: true
  # Not needed (telemetry / optional native ssh for testcontainers):
  '@scarf/scarf': false
  cpu-features: false
  ssh2: false
  # Sentry CLI binary is only needed for source-map uploads (not configured yet).
  '@sentry/cli': false
  # core-js (via posthog-js) only prints a funding banner in postinstall.
  core-js: false

# Peers are declared explicitly. Auto-installing them made the API's production bundle pick up the
# web app's optional better-auth peers (next/react/playwright, +450 MB).
autoInstallPeers: false

peerDependencyRules:
  # Sentry's webpack plugin is unused (Next 16 builds with Turbopack).
  ignoreMissing:
    - webpack
  allowedVersions:
    # Codegen-only dev tool; works with TypeScript 6.
    openapi-typescript>typescript: '6'

# Security patches for transitive deps (pnpm audit). Remove once upstream pins catch up.
overrides:
  fastify: 5.12.5
  js-yaml@>=5.0.0 <5.4.1: 5.4.1

# Patient network settings for slow or flaky connections (also used inside the Docker build).
fetchRetries: 6
fetchRetryMintimeout: 10000
fetchRetryMaxtimeout: 120000
fetchTimeout: 600000
networkConcurrency: 8
